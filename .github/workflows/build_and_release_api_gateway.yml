name: Build And Release API Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - ./api-gateway/**
    branches:
      - production
      - release/*

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  build_and_release_api_gateway:
    uses: ./.github/workflows/actions/release-template.yml
    with:
      project_name: 'api-gateway'
      docker_buildx_cache_to: 'api-gateway'
      docker_registry: ${{ vars.DOCKER_REGISTRY }}
      dockerfile: 'Dockerfile'
      docker_build_context: './api-gateway'
      docker_buildx_cache_from: 'api-gateway'
      pre_release: 'false'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}




