name: Pre Release and Deploy API Jars to Artifactory
on:
  workflow_dispatch:
  push:
    paths:
      - commons/**
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
# One release at a time: runs share the release-pom branch and the parent-<version> tag.
# Never cancel an in-flight run, a half-finished release would leave artifacts published without a tag/PR.
concurrency:
  group: deploy-api-jars
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip the run caused by merging the release PR, otherwise it would open another one
    if: "${{ !contains(github.event.head_commit.message, 'release-pom') && !contains(github.event.head_commit.message, '[maven-release-plugin]') && !contains(github.event.head_commit.message, 'chore: release ') }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up git user
        uses: fregante/setup-git-user@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Maven settings.xml for Artifactory
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>data-viz-release</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
              <server>
                <id>data-viz-snapshot</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Deploy Parent
        run: mvn clean deploy --batch-mode
      - name: Build and Deploy
        working-directory: ./commons
        run: mvn clean deploy --batch-mode

      - name: Check for SNAPSHOT versions
        id: check_snapshot
        run: |
          VERSIONS=$(mvn -q --also-make exec:exec -Dexec.executable="echo" -Dexec.args='${project.version}')

          echo "All module versions:"
          echo "$VERSIONS"

          SNAPSHOT_COUNT=$(echo "$VERSIONS" | grep -c "SNAPSHOT" || echo "0")

          if [ "$SNAPSHOT_COUNT" -gt 0 ]; then
            echo "has_snapshot=true" >> $GITHUB_OUTPUT
            echo "✓ Found $SNAPSHOT_COUNT SNAPSHOT version(s), will proceed with release"
          else
            echo "has_snapshot=false" >> $GITHUB_OUTPUT
            echo "✗ No SNAPSHOT versions found, skipping release"
          fi


      - name: Check for a pending release
        id: check_pending
        if: steps.check_snapshot.outputs.has_snapshot == 'true'
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # main keeps the -SNAPSHOT version until the release PR is merged, so the
          # parent-<version> tag is the one marker of "already prepared" for this version
          TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/parent-$VERSION" | wc -l)
          echo "tag_exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Prepare Maven Release on release-pom branch
        if: steps.check_pending.outputs.tag_exists == '0'
        run: |
          VERSION=${{ steps.check_pending.outputs.version }}
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))-SNAPSHOT"

          # main is protected, so the release commits go to a branch and are merged through a PR
          git checkout -B release-pom

          # Nothing is pushed by the plugin: it commits and tags locally only
          mvn -B release:prepare \
            -DreleaseVersion=$VERSION \
            -DdevelopmentVersion=$NEXT_VERSION \
            -DtagNameFormat=parent-@{project.version} \
            -DpushChanges=false \
            -DpreparationGoals="clean verify -Dcheckstyle.skip" \
            -DskipTests

      # Pushed as one atomic update: if either ref is rejected, neither lands, so a
      # failure here never leaves a branch or tag behind with nothing to show for it.
      - name: Push release-pom branch and tag
        if: steps.check_pending.outputs.tag_exists == '0'
        run: |
          VERSION=${{ steps.check_pending.outputs.version }}
          git push --atomic origin release-pom "refs/tags/parent-$VERSION"

      # Runs whenever a release is in flight, whether the tag was just pushed above or
      # already existed from an earlier run, so a PR that previously failed to open is
      # retried here instead of leaving the release stranded with no path back to main.
      - name: Ensure release PR exists
        if: steps.check_pending.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.check_pending.outputs.version }}
          OPEN_PRS=$(gh pr list --base main --head release-pom --state open --json number --jq 'length')
          if [ "$OPEN_PRS" -eq 0 ]; then
            gh pr create --base main --head release-pom \
              --title "chore: release $VERSION" \
              --body "Created by the Maven release process: sets the release versions and the next development iteration. Tag \`parent-$VERSION\` has been pushed."
          fi

      # Deploys the tagged release. It is safe to repeat: each module is only deployed when its
      # release version is missing from Artifactory, so it also finishes a half-published release.
      - name: Publish release from tag
        if: steps.check_pending.outputs.version != ''
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          TAG="parent-${{ steps.check_pending.outputs.version }}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG does not exist yet, nothing to publish"
            exit 0
          fi

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"

          # Derived from the POM's own distributionManagement instead of hardcoded in the
          # workflow, so the release host/path has exactly one source of truth.
          REPO_BASE=$(mvn help:evaluate -Dexpression=project.distributionManagement.repository.url -q -DforceStdout -N)
          GROUP_PATH=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout -N | tr '.' '/')
          REPO="$REPO_BASE/$GROUP_PATH"

          published() {
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "$ARTIFACTORY_USERNAME:$ARTIFACTORY_PASSWORD" "$REPO/$1/$2/$1-$2.pom")
            [ "$CODE" = "200" ]
          }

          PARENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -N)
          COMMONS_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f commons/pom.xml)

          if published parent "$PARENT_VERSION"; then
            echo "parent $PARENT_VERSION already published"
          else
            mvn -B -N clean deploy -DskipTests
          fi

          if published commons "$COMMONS_VERSION"; then
            echo "commons $COMMONS_VERSION already published"
          else
            mvn -B -f commons/pom.xml clean deploy -DskipTests
          fi
