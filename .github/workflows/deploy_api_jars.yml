name: Pre Release and Deploy API Jars to Artifactory
on:
  workflow_dispatch:
  push:
    paths:
      - commons/**
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
# One release at a time: runs share the release-pom branch and the parent-<version> tag.
# Never cancel an in-flight run, a half-finished release would leave artifacts published without a tag/PR.
concurrency:
  group: deploy-api-jars
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip the run caused by merging the release PR, otherwise it would open another one
    if: ${{ !contains(github.event.head_commit.message, 'release-pom') && !contains(github.event.head_commit.message, '[maven-release-plugin]') && !contains(github.event.head_commit.message, 'chore: release ') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up git user
        uses: fregante/setup-git-user@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Maven settings.xml for Artifactory
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>data-viz-release</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
              <server>
                <id>data-viz-snapshot</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Deploy Parent
        run: mvn clean deploy --batch-mode
      - name: Build and Deploy
        working-directory: ./commons
        run: mvn clean deploy --batch-mode

      - name: Check for SNAPSHOT versions
        id: check_snapshot
        run: |
          VERSIONS=$(mvn -q --also-make exec:exec -Dexec.executable="echo" -Dexec.args='${project.version}')

          echo "All module versions:"
          echo "$VERSIONS"

          SNAPSHOT_COUNT=$(echo "$VERSIONS" | grep -c "SNAPSHOT" || echo "0")

          if [ "$SNAPSHOT_COUNT" -gt 0 ]; then
            echo "has_snapshot=true" >> $GITHUB_OUTPUT
            echo "✓ Found $SNAPSHOT_COUNT SNAPSHOT version(s), will proceed with release"
          else
            echo "has_snapshot=false" >> $GITHUB_OUTPUT
            echo "✗ No SNAPSHOT versions found, skipping release"
          fi


      - name: Check no release is already pending
        id: check_pending
        if: steps.check_snapshot.outputs.has_snapshot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION=${CURRENT_VERSION%-SNAPSHOT}
          OPEN_PRS=$(gh pr list --base main --head release-pom --state open --json number --jq 'length')
          TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/parent-$VERSION" | wc -l)

          if [ "$OPEN_PRS" -gt 0 ] || [ "$TAG_EXISTS" -gt 0 ]; then
            echo "pending=true" >> $GITHUB_OUTPUT
            echo "A release PR is open or tag parent-$VERSION already exists, skipping release"
          else
            echo "pending=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Maven Release on release-pom branch
        if: steps.check_snapshot.outputs.has_snapshot == 'true' && steps.check_pending.outputs.pending != 'true'
        id: release
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))-SNAPSHOT"

          # main is protected, so the release commits go to a branch and are merged through a PR
          git checkout -B release-pom

          # Nothing is pushed by the plugin: it commits and tags locally only
          mvn -B release:prepare \
            -DreleaseVersion=$VERSION \
            -DdevelopmentVersion=$NEXT_VERSION \
            -DtagNameFormat=parent-@{project.version} \
            -DpushChanges=false \
            -DpreparationGoals="clean verify -Dcheckstyle.skip" \
            -DskipTests

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Perform Maven Release
        if: steps.check_snapshot.outputs.has_snapshot == 'true' && steps.check_pending.outputs.pending != 'true'
        run: |
          mvn -B release:perform \
            -DlocalCheckout=true \
            -Dgoals=deploy \
            -DskipTests

      - name: Push release-pom branch and open PR
        if: steps.check_snapshot.outputs.has_snapshot == 'true' && steps.check_pending.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.release.outputs.version }}
          git push --force origin release-pom
          git push origin "parent-$VERSION"
          gh pr create --base main --head release-pom \
            --title "chore: release $VERSION" \
            --body "Created by the Maven release process: sets the release versions and the next development iteration. Tag \`parent-$VERSION\` has been pushed." \
            || echo "PR already exists"
