name: Build And Release APIs

on:
  workflow_dispatch:
  push:
    branches:
      - production
      - release/*

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  prepare-a-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Generate Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: 'production,release/*'
          pre_release_branches: 'main'
          tag_prefix: 'v'
          dry_run: 'true'

  build_and_release_api_gateway:
    needs: prepare-a-release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ needs.prepare-a-release.outputs.new_version }}
      new_tag: ${{ needs.prepare-a-release.outputs.new_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha, scope=api-gateway
          cache-to: type=gha, scope=api-gateway
          context: ./api-gateway
          push: true
          build-args: |
            VERSION=${{ needs.prepare-a-release.outputs.new_version }}
            TAG=${{ needs.prepare-a-release.outputs.new_tag }}
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/data-viz/api-gateway:latest
            ${{ vars.DOCKER_REGISTRY }}/data-viz/api-gateway:v${{ needs.prepare-a-release.outputs.new_version }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/devgateway/tcdi
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build the Maven project
        run: |
          mkdir /opt/viz \
          && mvn -B compile package -DskipTests \
          && mv ./target/*-0.0.1-SNAPSHOT.jar /opt/viz \


      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: '--unreleased'
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push-docker-image.outputs.new_tag }}
          files: forms/target/*.jar
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



