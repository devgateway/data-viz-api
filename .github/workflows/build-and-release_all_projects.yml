name: Build and release All Projects
on:
  workflow_dispatch:
    inputs:
      package_bump:
        description: Package Bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  packages: write


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-services:
    name: Build And Release ${{ matrix.project_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - project_name: 'api-gateway'
            docker_build_context: './api-gateway'
          - project_name: 'api-security'
            docker_build_context: './api-security'
          - project_name: 'registry'
            docker_build_context: './registry'
          - project_name: 'superset-proxy'
            docker_build_context: './superset-proxy'
    uses: ./.github/workflows/release-template.yml
    with:
      project_name: ${{ matrix.project_name }}
      docker_buildx_cache_to: ${{ matrix.project_name }}
      docker_registry: ${{ vars.DOCKER_REGISTRY }}
      dockerfile: 'Dockerfile'
      docker_build_context: ${{ matrix.docker_build_context }}
      docker_buildx_cache_from: ${{ matrix.project_name }}
      pre_release: 'false'
      package_bump: ${{ github.event.inputs.package_bump }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-and-release-commons-library:
    name: Build And Release Commons Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up git user
        uses: fregante/setup-git-user@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Configure Maven settings.xml for Artifactory
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>data-viz-release</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
              <server>
                <id>data-viz-snapshot</id>
                <username>${{ secrets.ARTIFACTORY_USERNAME }}</username>
                <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Deploy Parent
        run: mvn clean deploy --batch-mode
      - name: Build and Deploy
        working-directory: ./commons
        run: mvn clean deploy --batch-mode

      - name: Check for SNAPSHOT versions
        id: check_snapshot
        run: |
          VERSIONS=$(mvn -q --also-make exec:exec -Dexec.executable="echo" -Dexec.args='${project.version}')

          echo "All module versions:"
          echo "$VERSIONS"

          SNAPSHOT_COUNT=$(echo "$VERSIONS" | grep -c "SNAPSHOT" || echo "0")

          if [ "$SNAPSHOT_COUNT" -gt 0 ]; then
            echo "has_snapshot=true" >> $GITHUB_OUTPUT
            echo "✓ Found $SNAPSHOT_COUNT SNAPSHOT version(s), will proceed with release"
          else
            echo "has_snapshot=false" >> $GITHUB_OUTPUT
            echo "✗ No SNAPSHOT versions found, skipping release"
          fi


      - name: Prepare Maven Release
        if: steps.check_snapshot.outputs.has_snapshot == 'true'
        run: mvn release:prepare --batch-mode

      - name: Perform Maven Release
        if: steps.check_snapshot.outputs.has_snapshot == 'true'
        run: |
          # Get current version from pom.xml
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $CURRENT_VERSION"

          # Remove -SNAPSHOT and calculate next version
          VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))-SNAPSHOT"

          # Perform release
          mvn -B release:prepare release:perform \
            -DreleaseVersion=$VERSION \
            -DdevelopmentVersion=$NEXT_VERSION \
            -DtagNameFormat=v@{project.version} \
            -DpushChanges=true \
            -DlocalCheckout=true \
            -DpreparationGoals="clean verify -Dcheckstyle.skip" \
            -Dgoals=deploy \
            -DskipTests

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version $VERSION"