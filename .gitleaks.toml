# Gitleaks configuration
# See: https://github.com/gitleaks/gitleaks/tree/master#configuration

title = "data-viz-api gitleaks config"

[extend]
# Extend the default ruleset
useDefault = true

[[allowlists]]
description = "Allow Spring env-var fallback placeholders (not real secrets)"
regexes = [
    # Matches patterns like ${VAR_NAME:some-default-value}
    '''\$\{[A-Z_]+:[^}]+\}''',
    # Matches Docker Compose variable syntax ${VAR:-default}
    '''\$\{[A-Z_]+:-[^}]+\}''',
]

[[allowlists]]
description = "Allow placeholder values explicitly set to NONE or example values"
regexes = [
    '''google\.cloud\.key=NONE''',
    '''google\.translation\.app=NONE''',
    '''your-superset-instance\.example\.com''',
    '''change-me-in-production''',
    '''dev-only-jwt-secret''',
]
