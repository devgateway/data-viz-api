eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery.locator:
        enabled: true
        lowerCaseServiceId: true

    default-filters:
      - AddResponseHeader=X-Gateway, true

server:
  port: 8080
  compression:
    enabled: true