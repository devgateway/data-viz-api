eureka:
  instance:
    metadata-map:
      type: data
      label: Superset Proxy
      superset: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
spring:
  main:
    lazy-initialization: true
  application:
    name: superset-proxy
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password: admin

viz:
  superset:
    url: https://your-superset-instance.example.com/
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health
