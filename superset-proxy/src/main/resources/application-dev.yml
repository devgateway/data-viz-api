eureka:
  instance:
    metadata-map:
      type: data
      label: Superset Proxy
      superset: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
spring:
  main:
    lazy-initialization: true
  application:
    name: superset-proxy
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password: admin

viz:
  superset:
    url: https://superset.alive.dgstg.org
    warmup:
      top: 100

server:
  port: 8888
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
    enabled-methods: GET,POST

management:
  endpoints:
    web:
      exposure:
        include: health
appconfig:
  cache:
    enabled=true: