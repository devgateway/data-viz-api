eureka:
  instance:
    metadata-map:
      type: data
      label: Superset Proxy
      superset: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: superset-proxy
viz:
  superset:
    url: https://your-superset-instance.example.com/
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health
